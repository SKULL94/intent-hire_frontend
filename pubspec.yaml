name: hiring_intent
description: HireSignal — find companies hiring in your tech stack before jobs are posted.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7

  # Routing
  go_router: ^14.6.2

  # Dependency injection
  get_it: ^8.0.3

  # Networking
  http: ^1.2.2

  # Supabase (auth + DB + realtime)
  supabase_flutter: ^2.8.2

  # Functional error handling
  dartz: ^0.10.1

  # JSON serialization
  json_annotation: ^4.9.0

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Local storage
  shared_preferences: ^2.3.4

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.14
  json_serializable: ^6.8.0

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
